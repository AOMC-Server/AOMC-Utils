plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "aomc_utils" {
            sourceSet sourceSets.main
        }
    }
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
    maven { url 'https://maven.wispforest.io/releases/' }
    mavenCentral()
    // Parliament is published locally during development.
    mavenLocal()
}

dependencies {
    // Loom needs these to assemble the dev runtime; the mod's own code never
    // touches them (enforced by verifyParliamentPurity).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The only API this mod is written against. The parliament jar is
    // installed on the server separately (it is a mod, not bundled here).
    implementation "com.gentheowl:parliament:${project.parliament_version}"
}

// The whole point of the Parliament migration: mod code imports nothing from
// Minecraft, Mojang, Fabric, or Parliament internals. Fails the build if a
// banned import sneaks back in.
tasks.register('verifyParliamentPurity') {
    def sourceDir = file('src/main/java')
    inputs.dir sourceDir
    doLast {
        def banned = ['net.minecraft.', 'com.mojang.', 'net.fabricmc.', 'parliament.impl.',
                      'eu.pb4.', 'me.lucko.']
        def violations = []
        sourceDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            f.readLines().eachWithIndex { line, i ->
                def trimmed = line.trim()
                if (trimmed.startsWith('import ') && banned.any { trimmed.substring(7).startsWith(it) }) {
                    violations << "${f.path}:${i + 1}: ${trimmed}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Mojang/Fabric imports are banned; use parliament.api instead:\n"
                    + violations.join('\n'))
        }
    }
}
check.dependsOn 'verifyParliamentPurity'

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
